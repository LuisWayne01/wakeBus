<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PontoDesperta - Protótipo</title>
    
    <!-- Biblioteca de Mapas Gratuita (Leaflet) -->
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

    <style>
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background-color: #e9ecef; display: flex; justify-content: center; align-items: center; height: 100vh; margin: 0; }
        .mobile-container { background-color: #fff; width: 380px; height: 750px; border-radius: 30px; box-shadow: 0 10px 30px rgba(0,0,0,0.2); overflow: hidden; display: flex; flex-direction: column; border: 8px solid #112B47; }
        .header { background-color: #112B47; color: white; padding: 20px; text-align: center; }
        .header h1 { margin: 0; font-size: 26px; color: #F89B29; font-weight: 800; }
        .content { padding: 20px; flex-grow: 1; overflow-y: auto; }
        
        /* Estilos dos Inputs */
        .section-title { font-weight: bold; color: #112B47; margin-bottom: 10px; font-size: 15px; }
        .input-group { display: flex; gap: 10px; margin-bottom: 15px; }
        input { flex-grow: 1; padding: 10px; border: 1px solid #ccc; border-radius: 8px; font-size: 14px; width: 93%; margin-bottom: 10px; box-sizing: border-box; }
        
        /* Botões */
        button { background-color: #F89B29; color: white; border: none; padding: 10px 15px; border-radius: 8px; font-size: 14px; cursor: pointer; font-weight: bold; }
        button:hover { background-color: #e08920; }
        .btn-full { width: 100%; background-color: #112B47; margin-top: 10px; }
        .btn-full:hover { background-color: #0d2136; }
        .btn-stop { background-color: #dc3545; display: none; width: 100%; margin-top: 10px; }
        
        /* Card de Resultado e Mapa */
        .resultado-card { background-color: #f8f9fa; border-left: 5px solid #112B47; padding: 15px; border-radius: 8px; margin-bottom: 15px; display: none; }
        .ponto-item { padding: 8px 0; border-bottom: 1px solid #ddd; font-size: 13px; display: flex; align-items: center; }
        #mapa { height: 150px; width: 100%; border-radius: 8px; margin-top: 10px; border: 1px solid #ccc; display: none; }
        
        .admin-section { margin-top: 20px; padding-top: 20px; border-top: 2px dashed #ccc; }
        .simulacao-badge { background-color: #28a745; color: white; padding: 5px 10px; border-radius: 15px; font-size: 12px; text-align: center; margin-top: 10px; display: none; font-weight: bold; }
    </style>
</head>
<body>

<div class="mobile-container">
    <div class="header">
        <h1>WakeBus</h1>
        <p style="margin: 5px 0 0 0; font-size: 14px;">Alerta de Ônibus Offline</p>
    </div>
    
    <div class="content">
        <!-- ÁREA DO PASSAGEIRO -->
        <div class="section-title">Buscar Rota</div>
        <div class="input-group">
            <input type="text" id="codigoLinha" placeholder="Ex: 5106" value="5106">
            <button onclick="buscarRota()">Baixar</button>
        </div>
        <div id="status" style="color: #666; font-size: 14px; margin-bottom: 15px;"></div>
        
        <div id="resultadoBox" class="resultado-card">
            <h3 id="nomeRota" style="margin-top: 0; color: #112B47; font-size: 16px;">-</h3>
            <div id="listaPontos"></div>
            
            <!-- Div onde o mapa vai aparecer -->
            <div id="mapa"></div>

            <div id="simulacaoStatus" class="simulacao-badge">Simulando GPS... Movendo...</div>
            <button id="btnAtivar" class="btn-full" onclick="simularViagem()">Ativar Alarme GPS</button>
            <button id="btnParar" class="btn-stop" onclick="pararAlarme()">DESLIGAR ALARME</button>
        </div>

        <!-- ÁREA DO ADMINISTRADOR -->
        <div class="admin-section">
            <div class="section-title">Modo Admin: Cadastrar Nova Linha</div>
            <input type="text" id="novoCodigo" placeholder="Código (Ex: 8101)">
            <input type="text" id="novoNome" placeholder="Nome (Ex: Alto da Prudente)">
            <input type="text" id="novoEmbarque" placeholder="Embarque (Ex: Praça Sete)">
            <input type="text" id="novoDesembarque" placeholder="Desembarque (Ex: BH Shopping)">
            <button onclick="cadastrarRota()" class="btn-full" style="background-color: #112B47;">Salvar na API</button>
            <div id="statusAdmin" style="color: green; font-size: 14px; margin-top: 10px; text-align: center;"></div>
        </div>
    </div>
</div>

<script>
    let mapaInstance = null;
    let alarmeLoop = null;
    let audioCtx = null;
    let marcadoresAtuais = []; // Guarda os pinos para apagar depois

    async function buscarRota() {
        const codigo = document.getElementById('codigoLinha').value;
        const statusEl = document.getElementById('status');
        const box = document.getElementById('resultadoBox');
        const lista = document.getElementById('listaPontos');
        const nomeRota = document.getElementById('nomeRota');
        const divMapa = document.getElementById('mapa');

        statusEl.innerText = "Buscando na API C#...";
        box.style.display = 'none';
        lista.innerHTML = '';
        divMapa.style.display = 'none';

        try {
            const response = await fetch(`https://wakebus.onrender.com/api/rotas/${codigo}`);
            if (!response.ok) {
                statusEl.innerText = "❌ Linha não encontrada.";
                statusEl.style.color = "red";
                return;
            }
            const json = await response.json();
            
            nomeRota.innerText = `${json.dados.codigo} - ${json.dados.nomeDescritivo}`;
            
            let coordsParaMapa = [];

            json.dados.pontos.forEach(ponto => {
                const div = document.createElement('div');
                div.className = 'ponto-item';
                div.innerText = ponto.descricaoLocal;
                lista.appendChild(div);
                coordsParaMapa.push([ponto.latitude, ponto.longitude]);
            });

            statusEl.innerText = "✔️ Sincronizado para uso offline";
            statusEl.style.color = "green";
            box.style.display = 'block';

            // --- CONFIGURAÇÃO DO MAPA ---
            divMapa.style.display = 'block';
            
            if (!mapaInstance) {
                mapaInstance = L.map('mapa');
                // AQUI USAMOS O SERVIDOR DA ESRI PARA NÃO DAR ERRO AMARELO
                L.tileLayer('https://server.arcgisonline.com/ArcGIS/rest/services/World_Street_Map/MapServer/tile/{z}/{y}/{x}', { 
                    attribution: 'Esri' 
                }).addTo(mapaInstance);
            }

            setTimeout(() => { 
                mapaInstance.invalidateSize(); 

                marcadoresAtuais.forEach(m => mapaInstance.removeLayer(m));
                marcadoresAtuais = [];

                if(coordsParaMapa.length > 0) {
                    let limites = L.latLngBounds();
                    
                    coordsParaMapa.forEach(coord => {
                        let pino = L.marker(coord).addTo(mapaInstance);
                        marcadoresAtuais.push(pino);
                        limites.extend(coord); 
                    });

                    // AQUI O MAPA AFASTA O ZOOM SOZINHO PARA CABER OS 2 PINOS
                    mapaInstance.fitBounds(limites, { padding: [20, 20], maxZoom: 15 });
                }
            }, 300);

        } catch (error) {
            statusEl.innerText = "Erro de conexão. A API C# está rodando?";
            statusEl.style.color = "red";
        }
    }

    // Função que chama o GPS via Satélite
    async function obterCoordenadas(endereco) {
        try {
            const busca = encodeURIComponent(endereco + ", Região Metropolitana de Belo Horizonte, Brasil");
            const response = await fetch(`https://nominatim.openstreetmap.org/search?format=json&limit=1&q=${busca}`);
            const data = await response.json();
            
            if (data && data.length > 0) {
                return { lat: parseFloat(data[0].lat), lon: parseFloat(data[0].lon) };
            }
        } catch (error) {
            console.log("Erro no GPS:", error);
        }
        return { lat: -19.92 + (Math.random()*0.05), lon: -43.94 + (Math.random()*0.05) };
    }

    async function cadastrarRota() {
        const statusAdmin = document.getElementById('statusAdmin');
        const codigo = document.getElementById('novoCodigo').value;
        const nome = document.getElementById('novoNome').value;
        const embarque = document.getElementById('novoEmbarque').value;
        const desembarque = document.getElementById('novoDesembarque').value;

        if(!codigo || !nome || !embarque || !desembarque) {
            statusAdmin.innerText = "Preencha todos os campos!";
            statusAdmin.style.color = "red";
            return;
        }

        statusAdmin.innerText = "📍 Buscando coordenadas por satélite...";
        statusAdmin.style.color = "#112B47";

        const coordEmbarque = await obterCoordenadas(embarque);
        // AQUI COLOCAMOS O ATRASO PARA A API GRATUITA NÃO BLOQUEAR
        await new Promise(r => setTimeout(r, 1000)); 
        const coordDesembarque = await obterCoordenadas(desembarque);

        const novaRota = {
            codigo: codigo,
            nomeDescritivo: nome,
            pontos: [
                { id: Math.floor(Math.random() * 1000), latitude: coordEmbarque.lat, longitude: coordEmbarque.lon, descricaoLocal: "🟢 Embarque: " + embarque },
                { id: Math.floor(Math.random() * 1000), latitude: coordDesembarque.lat, longitude: coordDesembarque.lon, descricaoLocal: "🔴 Destino: " + desembarque }
            ]
        };

        try {
            statusAdmin.innerText = "💾 Salvando no Backend (C#)...";
           const response = await fetch('https://wakebus.onrender.com/api/rotas', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify(novaRota)
            });

            if (response.ok) {
                statusAdmin.innerText = "✔️ Rota salva com sucesso!";
                statusAdmin.style.color = "green";
                document.getElementById('novoCodigo').value = '';
                document.getElementById('novoNome').value = '';
                document.getElementById('novoEmbarque').value = '';
                document.getElementById('novoDesembarque').value = '';
            }
        } catch (error) {
            statusAdmin.innerText = "Erro ao salvar na API.";
            statusAdmin.style.color = "red";
        }
    }

    // --- Lógica de Simulação e Som de Alarme ---
    function simularViagem() {
        document.getElementById('btnAtivar').style.display = 'none';
        const status = document.getElementById('simulacaoStatus');
        status.style.display = 'block';
        
        setTimeout(() => {
            status.style.backgroundColor = "#dc3545";
            status.innerText = "⚠️️ CHEGANDO AO DESTINO!";
            document.getElementById('btnParar').style.display = 'block';
            tocarSomAlarme();
        }, 4000);
    }

    function tocarSomAlarme() {
        if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
        
        const beep = () => {
            const osc = audioCtx.createOscillator();
            const gain = audioCtx.createGain();
            osc.connect(gain);
            gain.connect(audioCtx.destination);
            osc.type = 'square';
            osc.frequency.value = 800; 
            osc.start(audioCtx.currentTime);
            osc.stop(audioCtx.currentTime + 0.3);
        };

        beep();
        alarmeLoop = setInterval(beep, 600);
    }

    function pararAlarme() {
        clearInterval(alarmeLoop);
        document.getElementById('btnParar').style.display = 'none';
        document.getElementById('btnAtivar').style.display = 'block';
        
        const status = document.getElementById('simulacaoStatus');
        status.style.display = 'none';
        status.style.backgroundColor = "#28a745";
        status.innerText = "Simulando GPS... Movendo...";
    }
</script>
</body>
</html>
